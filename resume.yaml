# Next-Day Weather Forecast & Pipeline Configuration (Resume Mode)

pipeline:
  mode: "resume"              # Execution mode: "resume" (load weights & append history) or "reset" (scratch clean)
  output_dir: "report"         # Target directory for reports, web UI assets, and outputs
  data_dir: "data"             # Directory containing input CSV datasets


optimization:
  target_mae: 1.0              # Target validation MAE threshold in °C to reach adequate performance
  epochs_per_iter: 8           # Number of training epochs executed per iteration block
  max_iters: 8                 # Maximum number of restartable training iteration passes
  lr_decay_enabled: true       # Enable/disable performance-based learning rate decay policy
  lr_decay_policy: "plateau_restart" # Policy strategy: "plateau", "plateau_restart", "exponential_plateau", "step_plateau", "cyclic"
  lr_decay_factor: 0.75         # Decay reduction factor (e.g. 0.5 reduces LR by half)
  lr_decay_patience: 6         # Patience in epochs/iterations before decaying LR
  lr_min: 1e-3                 # Minimum learning rate floor limit (also base LR for cyclic)
  lr_decay_threshold: 0.00001  # Minimum delta metric change to qualify as performance improvement
  lr_cooldown: 3               # Cooldown iterations after LR reduction
  lr_restart_patience: 6       # Stagnation epochs at floor limit before triggering Warm Restart Bump
  lr_restart_factor: 0.5       # Warm restart factor to boost LR (bump_lr = restart_factor * initial_lr)
  lr_max_lr: null              # Maximum peak learning rate for cyclic policy (defaults to initial_lr if null)
  lr_cycle_step_size: 5        # Half-cycle duration in epochs for cyclic policy
  lr_cyclic_mode: "triangular" # Cyclic mode: "triangular", "triangular2", or "exp_range"

# --- Model Specific Parametrizations & Run Flags ---

persistence:
  enabled: true                # Enable/disable Persistence baseline model

climatology:
  enabled: true                # Enable/disable Climatology baseline model

ridge:
  enabled: false               # Enable/disable Ridge Linear Regression model
  alpha: 1.0                   # L2 regularization strength for Ridge regression
  learning_rate: 0.01          # Base SGD learning rate for Ridge optimization
  lr_decay_enabled: true       # Enable LR decay policy on Ridge training
  lr_decay_policy: "plateau_restart"
  lr_decay_factor: 0.75         # Factor by which LR is reduced upon plateau
  lr_decay_patience: 6         # Number of iterations without improvement before LR decay
  lr_cooldown: 3
  lr_restart_patience: 6
  lr_restart_factor: 0.5

gbdt:
  enabled: false               # Enable/disable Gradient Boosted Trees (HistGradientBoosting) model
  max_iter: 40                 # Maximum iterations/trees for HistGradientBoosting
  learning_rate: 0.1           # Initial learning rate for gradient boosting
  random_state: 42             # Random state seed for reproducibility
  lr_decay_enabled: true       # Enable LR decay policy across boosting stages
  lr_decay_policy: "plateau_restart"
  lr_decay_factor: 0.75         # Factor by which LR is reduced upon plateau
  lr_decay_patience: 6         # Number of iterations without improvement before LR decay
  lr_cooldown: 3
  lr_restart_patience: 6
  lr_restart_factor: 0.5

lstm:
  enabled: true                # Enable/disable LSTM Deep Learning model
  units: 64                    # Number of hidden units in LSTM layer
  learning_rate: 0.0005        # Optimizer learning rate (Adam)
  batch_size: 64               # Batch size for mini-batch training
  patience: 10                 # Early stopping patience in epochs
  dropout: 0.2                 # Dropout rate for regularization
  lr_decay_enabled: true       # Enable performance-based learning rate decay
  lr_decay_policy: "plateau_restart"
  lr_decay_factor: 0.75         # Factor by which LR is reduced upon performance plateau
  lr_decay_patience: 6         # Epochs without validation improvement before LR decay
  lr_cooldown: 3
  lr_restart_patience: 6
  lr_restart_factor: 0.5

cnn:
  enabled: true                # Enable/disable Convolutional Neural Network (CNN) model
  filters: 64                  # Number of 1D convolutional filters
  kernel_size: 3               # Kernel size for 1D convolution
  learning_rate: 0.0005        # Optimizer learning rate (Adam)
  batch_size: 64               # Batch size for mini-batch training
  patience: 10                 # Early stopping patience in epochs
  dropout: 0.2                 # Dropout rate for regularization
  lr_decay_enabled: true       # Enable performance-based learning rate decay
  lr_decay_policy: "plateau_restart"
  lr_decay_factor: 0.75         # Factor by which LR is reduced upon performance plateau
  lr_decay_patience: 6         # Epochs without validation improvement before LR decay
  lr_cooldown: 3
  lr_restart_patience: 6
  lr_restart_factor: 0.5

dense:
  enabled: true                # Enable/disable Dense Neural Network model
  hidden_units: [128, 64]      # Layer dimensions for dense hidden layers
  learning_rate: 0.0005        # Optimizer learning rate (Adam)
  batch_size: 64               # Batch size for mini-batch training
  patience: 10                 # Early stopping patience in epochs
  dropout: 0.2                 # Dropout rate for regularization
  lr_decay_enabled: true       # Enable performance-based learning rate decay
  lr_decay_policy: "plateau_restart"
  lr_decay_factor: 0.75         # Factor by which LR is reduced upon performance plateau
  lr_decay_patience: 6         # Epochs without validation improvement before LR decay
  lr_cooldown: 3
  lr_restart_patience: 6
  lr_restart_factor: 0.5

linear:
  enabled: true                # Enable/disable Linear Neural Network model
  learning_rate: 0.0005        # Optimizer learning rate (Adam)
  batch_size: 64               # Batch size for mini-batch training
  patience: 10                 # Early stopping patience in epochs
  lr_decay_enabled: true       # Enable performance-based learning rate decay
  lr_decay_policy: "plateau_restart"
  lr_decay_factor: 0.75         # Factor by which LR is reduced upon performance plateau
  lr_decay_patience: 6         # Epochs without validation improvement before LR decay
  lr_cooldown: 3
  lr_restart_patience: 6
  lr_restart_factor: 0.5

data_quality:
  temp_min: -30.0              # Physical minimum temperature threshold (°C)
  temp_max: 50.0               # Physical maximum temperature threshold (°C)
  dew_min: -40.0               # Physical minimum dew point threshold (°C)
  dew_max: 40.0                # Physical maximum dew point threshold (°C)
  sample_test_size: 200        # Number of sample test predictions to export for web UI visualization
