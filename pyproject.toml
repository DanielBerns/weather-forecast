[project]
name = "weather-forecast"
version = "0.1.0"
description = "Next-Day Temperature Forecasting & Precision Evaluation System for Comodoro Rivadavia"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.15.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "tensorflow",
]

[project.scripts]
forecast-pipeline = "forecast_system.pipeline:main"

[tool.uv.build-backend]
module-root = ""
module-name = "forecast_system"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
